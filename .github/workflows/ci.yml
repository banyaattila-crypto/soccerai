name: SoccerAI PRO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    name: Typecheck, Lint, Build & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (reproducible lockfile)
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc -b

      - name: Oxlint strict check (0 warnings, 0 errors)
        run: npx oxlint --deny-warnings

      - name: Production Vite build
        run: npm run build

      - name: Verify client bundle and source have no leaked API keys
        run: |
          # 1. Általános API kulcs minta ellenőrzése (auth fejlécek és kulcsnevek 32 karakteres hex értékkel)
          if grep -rnEi "(x-apisports-key|x-auth-token|api[_-]?key|secret)[\"'\s]*[:=][\"'\s]*[a-f0-9]{32}" src/ dist/ api/ vite.config.ts 2>/dev/null; then
            echo "ERROR: Hardcoded API key assignment detected in source or build output!"
            exit 1
          fi

          # 2. SHA-256 hash alapú ellenőrzés az ismert szivárgott kulcsok kiszűrésére (nincs plaintext kulcs a workflow-ban)
          BLOCKED_HASHES="3c7312788d6c2a128c89d6dbc7c2437acd6e36a515a87c50050638b16fe9eea4 a47bb250f4ee0003fdc8befa8d629530ffc735443ab5e98f960dfc62e0c636f1"
          FOUND_LEAK=0
          for token in $(grep -oE "\b[a-f0-9]{32}\b" src/ dist/ api/ vite.config.ts 2>/dev/null || true); do
            token_hash=$(echo -n "$token" | sha256sum | cut -d" " -f1)
            for blocked in $BLOCKED_HASHES; do
              if [ "$token_hash" = "$blocked" ]; then
                echo "ERROR: Compromised API key detected by SHA-256 hash fingerprint ($token_hash)!"
                FOUND_LEAK=1
              fi
            done
          done

          if [ "$FOUND_LEAK" -eq 1 ]; then
            exit 1
          fi
          echo "Secret scan passed: zero leaked keys or compromised hashes in source and dist/."
